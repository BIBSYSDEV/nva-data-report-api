AWSTemplateFormatVersion: 2010-09-09
Description: >
  NVA data report API (decommissioned). Only the buckets remain, with lifecycle
  rules that empty them so the stack can be deleted.

Parameters:
  AllowedOrigins:
    Type: String
    Description: Unused. Kept because the pipeline still passes it as a parameter override.
    Default: "*"
  LoaderBucketName:
    Type: String
    Default: loader-input-files
  KeyBatchesBucketName:
    Type: String
    Default: data-report-key-batches
  ExportBucketName:
    Type: String
    Default: data-report-csv-export

Resources:
  LoaderBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      BucketName: !Sub "${LoaderBucketName}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: EmptyBucket
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  KeyBatchesBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      BucketName: !Sub "${KeyBatchesBucketName}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: EmptyBucket
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ExportBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      BucketName: !Sub "${ExportBucketName}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: EmptyBucket
            Status: Enabled
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - Key: IncludedInBackup
          Value: "false"
      VersioningConfiguration:
        Status: Enabled

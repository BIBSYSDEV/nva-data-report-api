plugins {
    // Support convention plugins written in Groovy. Convention plugins are build scripts in 'src/main' that automatically become available as plugins in the main build.
    id 'groovy-gradle-plugin'
}

repositories {
    // Use the plugin portal to apply community plugins in convention plugins.
    gradlePluginPortal()
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
    gradleVersion = "8.0"
}

dependencies {
    implementation 'nebula.lint:nebula.lint.gradle.plugin:21.1.3'
    implementation 'org.jacoco:org.jacoco.core:0.8.14'
    implementation 'org.jacoco:org.jacoco.report:0.8.14'
    implementation 'io.github.michael-nestler:gradle-spectral:0.2.0-0'
}
